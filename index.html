<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b1020"><title>My Game — 3D MMORPG</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app"><section id="menu"><div class="brand"><span class="sigil">✦</span><div><h1>MY GAME</h1><p>3D Retro-MMORPG</p></div></div><div class="intro"><h2>Die Welt wartet.</h2><p>Erkunde einen dreidimensionalen Wald mit Wiesen, Lichtungen, Hügeln und drei Regionen.</p></div><form id="create"><label>Charaktername<input id="name" maxlength="16" required value="Held" autocomplete="off"></label><button class="primary">Abenteuer beginnen</button></form></section>
<section id="game" hidden><header><div class="topbar"><div><b id="hero"></b><span id="level"></span><span id="xp"></span></div><div><span id="hp"></span><span id="gold"></span><span id="region"></span></div></div><div class="progress"><i id="xpbar"></i></div></header>
<div class="game-shell"><div class="world-panel"><button id="menu-toggle" class="menu-toggle" aria-controls="game-menu" aria-expanded="false">☰ MENÜ</button><div id="world3d"></div><div class="location-card"><b id="locationName">Dämmerhain</b><span id="locationHint">Linker Stick: Umsehen · Rechter Stick: Bewegen</span></div>
<div id="look-stick" class="virtual-stick left-stick" aria-label="Umsehen"><div class="stick-base"><div class="stick-knob"></div></div><span>UMSEHEN</span></div>
<div id="move-stick" class="virtual-stick right-stick" aria-label="Bewegen"><div class="stick-base"><div class="stick-knob"></div></div><span>BEWEGEN</span></div></div>
<aside id="game-menu"><button id="menu-close" class="menu-close" type="button" aria-label="Menü schließen">×</button><nav class="tabs"><button class="tab active" data-tab="character">Charakter</button><button class="tab" data-tab="inventory">Inventar</button><button class="tab" data-tab="equipment">Ausrüstung</button><button class="tab" data-tab="spells">Zauber</button><button class="tab" data-tab="quests">Quests</button><button class="tab" data-tab="worldinfo">Welt</button></nav>
<div id="character" class="tab-pane"><div id="stats"></div><button id="levelup" class="wide" disabled>Attributpunkt verteilen</button></div><div id="inventory" class="tab-pane" hidden><div class="grid" id="inventory-grid"></div></div><div id="equipment" class="tab-pane" hidden><div id="equipment-list" class="card"></div></div><div id="spells" class="tab-pane" hidden><div id="spell-list"></div></div><div id="quests" class="tab-pane" hidden><div id="quest-list"></div></div><div id="worldinfo" class="tab-pane" hidden><div id="world-list"></div></div><h3>Aktionen</h3><div class="actions"><button id="talk">NPC</button><button id="attack">Angreifen</button><button id="heal">Heilen</button></div><p id="log"></p></aside></div></section></main>
<script src="vendor/three.min.js"></script><script src="game.js"></script></body></html>
