<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>My Game</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><section id="menu"><h1>MY GAME</h1><p>Ein originales Retro-MMORPG.</p><form id="create"><label>Name<input id="name" maxlength="16" required value="Held"></label><button>Charakter erstellen</button></form></section><section id="game" hidden><header><div><b id="hero"></b><span id="level"></span><span id="xp"></span><span id="hp"></span></div></header><div class="game-shell"><div class="world-panel"><canvas id="world" width="800" height="500"></canvas><div class="touch-controls"><button data-move="up">▲</button><div><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div></div></div><aside><nav class="tabs"><button class="tab active" data-tab="character">Charakter</button><button class="tab" data-tab="inventory">Inventar</button><button class="tab" data-tab="equipment">Ausrüstung</button><button class="tab" data-tab="spells">Zauber</button><button class="tab" data-tab="quests">Quests</button></nav><div id="character" class="tab-pane"><div id="stats"></div><button id="levelup" disabled>Attributpunkt verteilen</button></div><div id="inventory" class="tab-pane" hidden><div class="grid" id="inventory-grid"></div></div><div id="equipment" class="tab-pane" hidden><div class="paperdoll">Helm —<br>Waffe Trainingsschwert<br>Rüstung —<br>Stiefel —</div></div><div id="spells" class="tab-pane" hidden><div class="card">Keine Zauber gelernt.<br><small>Intelligenz und Weisheit werden später relevant.</small></div></div><div id="quests" class="tab-pane" hidden><div class="card"><b>Der erste Weg</b><p>Sprich mit der Wächterin am goldenen Marker.</p><span>Offen</span></div></div><h3>Aktionen</h3><div class="actions"><button id="talk">NPC</button><button id="attack">Angreifen</button><button id="heal">Heilen</button></div><p id="log"></p></aside></div></section></main><script src="game.js"></script></body></html>
