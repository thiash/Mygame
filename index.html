<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Game</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app"><section id="menu"><h1>MY GAME</h1><p>Ein originales Retro-MMORPG-Prototyp.</p><form id="create"><label>Name <input id="name" maxlength="16" required value="Held"></label><button>Charakter erstellen</button></form></section>
<section id="game" hidden><header><b id="hero"></b><span id="level"></span><span id="xp"></span><span id="hp"></span></header><div class="layout"><canvas id="world" width="640" height="400" aria-label="Spielwelt"></canvas><aside><h2>Charakter</h2><div id="stats"></div><button id="levelup" type="button" disabled>Attributpunkt verteilen</button><h2>Aktionen</h2><button id="talk" type="button">Mit NPC sprechen</button><button id="attack" type="button">Angreifen</button><button id="heal" type="button">Heilen</button><p id="log" aria-live="polite"></p></aside></div></section></main><script src="game.js"></script></body></html>
